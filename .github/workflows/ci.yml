name: Security checks
on:
  pull_request:
    branches: [develop, qa]
permissions:
  contents: read
concurrency:
  group: security-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile and test independent modules
        run: mvn -B verify
      - name: Verify explicit environment key paths
        run: |
          python3 -m pip install --disable-pip-version-check -r tests/requirements.txt
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 tests/check_key_paths.py
